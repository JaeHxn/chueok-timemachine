# main에 푸시하면 자동으로 빌드하고 Cloudflare Pages에 배포한다.
# 필요한 GitHub 저장소 Secret (저장소 Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN  - Cloudflare 대시보드에서 만든 API 토큰 (Pages 편집 권한)
#   CLOUDFLARE_ACCOUNT_ID - Cloudflare 계정 ID
name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      # 수집 JSON(../수집)을 읽어 items.json을 만든 뒤 빌드한다
      - run: npm run build

      - name: Prepare D1 tables
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 execute chueok-cheers --remote --file=schema.sql
          workingDirectory: web

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=chueok-timemachine --branch=main
          workingDirectory: web
