# main에 푸시하면 자동으로 빌드하고 Cloudflare Pages에 배포한다.
# 필요한 GitHub 저장소 Secret (저장소 Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN  - Cloudflare 대시보드에서 만든 API 토큰 (Pages 편집 권한)
#   CLOUDFLARE_ACCOUNT_ID - Cloudflare 계정 ID (미설정 시 기본 계정 ID 사용)
name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || 'c1d069bf29235a6135a32ad1804647b9' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build static assets and data
        run: npm run build

      - name: Publish to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=chueok-timemachine --branch=main
          workingDirectory: web

      - name: Skip notice when Cloudflare API Token is missing
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: |
          echo "::notice title=배포 알림::GitHub Secrets에 CLOUDFLARE_API_TOKEN이 등록되지 않아 자동 원격 배포 단계는 건너뛰었습니다."
          echo "정적 사이트 빌드(npm run build)는 정상 통과되었습니다."
          echo "GitHub Actions 자동 배포 연동을 원하시면 저장소 Settings > Secrets and variables > Actions에 CLOUDFLARE_API_TOKEN을 추가해 주세요."
