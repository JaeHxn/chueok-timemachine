<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>추억 타임머신 · 수집 데이터 미리보기</title>
<style>
:root{--card:#14243a;--ink:#f3eee4;--dim:#9aa6b8;--gold:#ffd27a;--pink:#e94560;--line:#24364d}
*{box-sizing:border-box}body{margin:0;background:#070d16;color:var(--ink);font-family:Pretendard,"Apple SD Gothic Neo",sans-serif;padding:16px 16px 60px}
.wrap{max-width:960px;margin:0 auto}
h1{font-size:22px;margin:4px 0}.sub{color:var(--dim);font-size:13px;margin-bottom:14px;line-height:1.6}
.years{display:flex;gap:6px;overflow-x:auto;padding:8px 0;border-bottom:1px solid var(--line)}
.years button{flex:none;border:1px solid var(--line);background:none;color:var(--dim);padding:6px 10px;border-radius:999px;font-size:13px;cursor:pointer}
.years button.on{background:var(--gold);color:#111;font-weight:700;border-color:var(--gold)}
.years button.empty{opacity:.45}
.cnt{font-size:14px;margin:14px 0}.cnt b{color:var(--gold)}
.cats{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.cats button{border:1px solid var(--line);background:none;color:var(--dim);padding:5px 10px;border-radius:8px;font-size:12px;cursor:pointer}
.cats button.on{background:var(--ink);color:#111}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px}
.meta{display:flex;gap:6px;flex-wrap:wrap;font-size:11px;color:var(--dim)}
.tag{background:#22364f;border-radius:6px;padding:2px 6px;color:var(--ink)}
.tag.low{background:#4a2b2b}.tag.high,.tag.medium{background:#2b4a3a}
.card h3{margin:2px 0;font-size:16px}.card p{margin:0;font-size:14px;line-height:1.6;color:#d8dee8}
.src{font-size:12px;color:var(--dim);line-height:1.6}.src a{color:var(--gold)}
.share{margin-top:auto}
.share button{border:1px solid var(--pink);background:var(--pink);color:#fff;padding:6px 12px;border-radius:8px;font-size:12px;cursor:pointer;font-weight:700}
.empty-box{border:1px dashed var(--line);border-radius:12px;padding:30px;text-align:center;color:var(--dim);grid-column:1/-1}
.sheet{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;justify-content:center;z-index:9}
.sheet.on{display:flex}
.sheet .box{background:var(--card);width:100%;max-width:520px;border-radius:16px 16px 0 0;padding:16px;border-top:1px solid var(--line)}
.sheet button{display:block;width:100%;margin:6px 0;padding:12px;border-radius:10px;border:1px solid var(--line);background:none;color:var(--ink);font-size:14px;cursor:pointer;text-align:left}
.note{font-size:12px;color:var(--dim);margin-top:24px;line-height:1.7;border-top:1px solid var(--line);padding-top:12px}
</style></head><body><div class="wrap">
<h1>🪐 추억 타임머신 · 수집 데이터 미리보기</h1>
<div class="sub">지금까지 모은 텍스트 데이터가 사이트에서 보일 모습입니다. 1950~70년대는 <b>텍스트 카드만</b>(이미지는 2차 때), 공유는 <b>자체 공유 시트</b>, 작성자 닉네임은 <b>비노출</b>, 카테고리는 <b>설계 분류표 8개</b>로 통일했습니다. "출처 확인"은 신뢰도가 low가 아닌 항목에만 붙입니다(원문 열람 검증은 아직 전체 완료 아님).</div>
<div class="years" id="years"></div>
<div class="cnt" id="cnt"></div>
<div class="cats" id="cats"></div>
<div class="grid" id="grid"></div>
<div class="note">※ 수집 원본을 그대로 옮긴 미리보기입니다. 실제 사이트에서는 검수(승인) 후에만 공개됩니다. 연당 20개 목표에 미달한 연도는 목표 미달로 표시됩니다.</div>
</div>
<div class="sheet" id="sheet"><div class="box">
<b style="font-size:15px" id="sh-title"></b>
<button id="sh-native">📤 기기 공유 (지원 기기)</button>
<button id="sh-copy">🔗 링크 복사</button>
<button id="sh-card">🖼️ 공유 카드 텍스트 복사 (인스타·블로그용)</button>
<button id="sh-kakao">💬 카카오톡 (도메인 등록 후 활성화)</button>
<button id="sh-close">닫기</button>
</div></div>

CC BY-SA 4.0"}],"confidence":"medium"},{"year":1951,"month":8,"precision":"month","cat":"가전·기술","title":"서울-부산 간 전화 개통","summary":"1951년 8월 16일 서울과 부산 사이 전화가 개통되었다고 연도 문서에 올라 있다.","sources":[{"url":"https://ko.wikipedia.org/wiki/1951년_대한민국","name":"위키백과 1951년 대한민국","license":"CC BY-SA 4.0"}],"confidence":"medium"},{"year":1951,"month":null,"precision":"year","cat":"놀이·문구","title":"피난지 학교와 천막교실","summary":"문교부가 1951년 피난지 학교 재개를 명령해 부산·대구·대전 등지에 피난 학교가 세워졌고, 노천교실·천막교실에서 수업했다는 학교 신문 기사가 있다. 검색 결과 요약만 보고 기사 본문은 직접 열지 못했다.","sources":[{"url":"https://hangyo.com/mobile/article.html?no=104737","name":"한국교육신문 광복 80주년 특별기획 6.25 전쟁과 천막교실","license":"미확인"}],"confidence":"low"},{"year":1952,"month":3,"precision":"month","cat":"사건·생활상","title":"광무신문지법 폐기","summary":"1952년 3월 19일 대한제국 시기에 만든 광무신문지법이 폐기되었다고 연도 문서에 적혀 있다.","sources":[{"url":"https://ko.wikipedia.org/wiki/1952년_대한민국","name":"위키백과 1952년 대한민국","license":"CC BY-SA 4.0"}],"confidence":"medium"},{"year":1952,"month":8,"precision":"month","cat":"사건·생활상","title":"문화보호법 제정","summary":"1952년 8월 7일 학술원과 예술원 설치 등을 정한 문화보호법이 제정되었다고 연도 문서에 기록되어 있다.","sources":[{"url":"https://ko.wikipedia.org/wiki/1952년_대한민국","name":"위키백과 1952년 대한민국","license":"CC BY-SA 4.0"}],"confidence":"medium"},{"year":1952,"month":null,"precision":"approx","cat":"음악","title":"번안곡 장미빛 인생과 샹송 붐","summary":"현인이 부른 번안곡 '장미빛 인생'이 1952년경 샹송 붐을 일으켰다고 위키백과 현인 항목에 적혀 있다. 연도는 '경'으로 표기되어 있다.","sources":[{"url":"https://ko.wikipedia.org/wiki/현인","name":"위키백과 현인","license":"CC BY-SA 4.0"}],"confidence":"low"},{"year":1953,"month":1,"precision":"month","cat":"사건·생활상","title":"여객선 창경호 침몰","summary":"1953년 1월 9일 다대포 앞바다에서 여객선 창경호가 침몰한 사고가 있었다.","sources":[{"url":"https://ko.wikipedia.org/wiki/1953년_대한민국","name":"위키백과 1953년 대한민국","license":"CC BY-SA 4.0"}],"confidence":"medium"},{"year":1953,"month":2,"precision":"month","cat":"사건·생활상","title":"화폐 단위 원에서 환으로 변경","summary":"1953년 2월 17일 화폐 단위가 원에서 환으로 바뀌었다고 연도 문서에 적혀 있다.","sources":[{"url":"https://ko.wikipedia.org/wiki/195 "month":12,"precision":"month","cat":"사건·생활상","title":"12·12 군사 반란","summary":"위키백과 1970년대 문서는 1979년 12·12 군사 반란을 전두환과 하나회 관련 정변으로 분류한다. 세부 경과는 해당 문서에 없다.","sources":[{"url":"https://ko.wikipedia.org/wiki/1970년대","name":"위키백과 1970년대","license":"CC BY-SA 4.0"}],"confidence":"medium"},{"year":1979,"month":null,"precision":"year","cat":"음악","title":"MBC FM 강변축제(강변가요제) 시작","summary":"1979년 경기도 가평 청평유원지에서 처음 열렸고 제1회에서는 홍삼트리오의 '기도'가 금상(최고상)을 받았다. 1·2회는 'MBC FM 강변축제'였고 3회부터 강변가요제로 불렸다.","sources":[{"url":"https://ko.wikipedia.org/wiki/강변가요제","name":"위키백과 강변가요제","license":"CC BY-SA 4.0"}],"confidence":"high"},{"year":1979,"month":null,"precision":"year","cat":"음악","title":"제3회 MBC 대학가요제, 김학래·임철우 '내가' 대상","summary":"1979년 제3회 MBC 대학가요제에서 명지대 김학래·임철우가 '내가'로 대상을 받았다.","sources":[{"url":"https://ko.wikipedia.org/wiki/MBC_대학가요제","name":"위키백과 MBC 대학가요제","license":"CC BY-SA 4.0"}],"confidence":"high"},{"year":1979,"month":null,"precision":"year","cat":"먹거리","title":"서울 한정식집 표준식단제 재시행","summary":"서울시 사진 아카이브에 따르면 1979년 서울 시내 한정식점에 표준식단제를 다시 시행해 쌀에 10% 이상 혼식하고 반찬을 5가지로 제한했다. 소비 절약을 노린 조치였다.","sources":[{"url":"https://archives.seoul.go.kr/photo/collection/detail/82","name":"서울사진아카이브 '불량식품 단속과 혼분식 장려'","license":"미확인"}],"confidence":"medium"},{"year":1979,"month":null,"precision":"year","cat":"놀이·문구","title":"고교 평준화, 대전 등으로 확대","summary":"1979년 대전 전 지역과 수원·전주·청주·제주·마산 등에서 고교 평준화가 시행됐다.","sources":[{"url":"https://ko.wikipedia.org/wiki/고교_평준화","name":"위키백과 고교 평준화","license":"CC BY-SA 4.0"}],"confidence":"high"}],"cats":["음악","TV·영화","먹거리","패션","놀이·문구","가전·기술","사건·생활상","유행어·풍속"]};
const TARGET = 20;
const allYears = []; for (let y = 1950; y <= 1979; y++) allYears.push(y);
let cur = 1950, curCat = "전체", curShare = null, shown = [];
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function render(){
  $("years").innerHTML = allYears.map(y => {
    const n = DATA.items.filter(i => i.year === y).length;
    return `<button class="${y===cur?'on':''} ${n===0?'empty':''}" data-y="${y}">${y}${n?' · '+n:''}</button>`;
  }).join("");
  const list = DATA.items.filter(i => i.year === cur);
  $("cnt").innerHTML = `${cur}년 · 수집 <b>${list.length}</b>개 / 목표 ${TARGET}개 ` +
    (list.length < TARGET ? "· <span style='color:#ffb4a2'>목표 미달</span>" : "· ✅ 목표 충족");
  const names = ["전체", ...DATA.cats, "미분류"];
  $("cats").innerHTML = names.map(c => {
    const n = c === "전체" ? list.length : list.filter(i => i.cat === c).length;
    if (c !== "전체" && n === 0) return "";
    return `<button class="${c===curCat?'on':''}" data-c="${c}">${c} ${n}</button>`;
  }).join("");
  shown = curCat === "전체" ? list : list.filter(i => i.cat === curCat);
  if (!list.length) { $("grid").innerHTML = `<div class="empty-box">🛸 ${cur}년은 아직 준비 중입니다.<br>(수집된 항목이 없습니다)</div>`; return; }
  $("grid").innerHTML = shown.map((i, idx) => {
    const when = i.month ? `${i.year}년 ${i.month}월` : (i.precision === "approx" ? `${i.year}년 전후` : `${i.year}년`);
    const src = i.sources.length ? i.sources.map(s => `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.name || s.url)}</a>`).join(" · ") : "출처 없음";
    const ok = i.sources.length && i.confidence !== "low";
    return `<div class="card">
      <div class="meta"><span class="tag">${esc(when)}</span><span class="tag">${esc(i.cat)}</span><span class="tag ${i.confidence}">${ok ? '출처 확인' : '검증 필요'}</span></div>
      <h3>${esc(i.title)}</h3>
      <p>${esc(i.summary)}</p>
      <div class="src">출처: ${src}</div>
      <div class="share"><button data-share="${idx}">📤 공유</button></div>
    </div>`;
  }).join("") || `<div class="empty-box">이 분류에는 항목이 없습니다.</div>`;
}
document.addEventListener("click", e => {
  const y = e.target.closest("[data-y]"); if (y) { cur = +y.dataset.y; curCat = "전체"; render(); return; }
  const c = e.target.closest("[data-c]"); if (c) { curCat = c.dataset.c; render(); return; }
  const s = e.target.closest("[data-share]"); if (s) {
    const it = shown[+s.dataset.share];
    curShare = { title: `${it.title} (${it.year}${it.month ? '.' + it.month : ''}) · 추억 타임머신`, text: it.summary, url: location.href };
    $("sh-title").textContent = curShare.title; $("sheet").classList.add("on"); return;
  }
  if (e.target.id === "sh-close" || e.target === $("sheet")) $("sheet").classList.remove("on");
  if (e.target.id === "sh-native") { if (navigator.share) navigator.share(curShare).catch(() => {}); else alert("이 기기는 기기 공유를 지원하지 않습니다. 링크 복사를 이용하세요."); }
  if (e.target.id === "sh-copy") { navigator.clipboard && navigator.clipboard.writeText(curShare.url); alert("링크를 복사했습니다."); }
  if (e.target.id === "sh-card") { navigator.clipboard && navigator.clipboard.writeText(curShare.title + "\n" + curShare.text + "\n" + curShare.url); alert("공유 카드 텍스트를 복사했습니다."); }
  if (e.target.id === "sh-kakao") alert("카카오 공유는 JavaScript 키와 도메인 등록 후 사용할 수 있습니다.");
});
render();
</script></body></html>
